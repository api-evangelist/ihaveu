name: Ihaveu
description: >-
  Ihaveu (优众网, ihaveu.com) was a Chinese business-to-consumer luxury fashion
  e-commerce platform founded in 2010 by Sun Tongyu (a former president of
  Alibaba's Taobao) and Chen Xiao. Based in China, it sold curated high-end
  designer apparel and accessories from international couture brands such as
  Prada, Hermes, and Marc Jacobs to Chinese consumers. It raised a Series A of
  roughly $11M in December 2010 led by IDG Capital and Lightspeed Venture
  Partners, followed by a Series B in 2012 that added The CID Group and JAFCO
  Asia. The company is no longer active and its ihaveu.com domain is now parked
  and listed for sale, so it exposes no live website, developer portal, or public
  API. This profile is retained in the API Evangelist network as an identity
  record for a defunct Lightspeed portfolio company; it has no API surface to
  enrich.
